name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_stack:
        description: 'Run the full SnowLuma image + noVNC + Caddy install test (heavy)'
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: |
          for f in install.sh install-core.sh lib/*.sh modules/*.sh tests/*.sh assets/bin/*; do
            [[ "$f" == *write-onebot-config ]] && continue
            bash -n "$f"
          done
          node --check assets/bin/write-onebot-config
      - name: Offline test suite
        run: |
          bash tests/static-check.sh
          bash tests/arch-check.sh
          bash tests/common-check.sh
          bash tests/onebot-check.sh
          bash tests/image-fallback-check.sh
          bash tests/github-fetch-check.sh
          bash tests/caddy-config-check.sh
          bash tests/mirror-menu-check.sh
          bash tests/noninteractive-check.sh
          bash tests/docs-check.sh
      - name: Release metadata check (GitHub API, may rate-limit)
        continue-on-error: true
        run: bash tests/release-check.sh
      - name: ShellCheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          files=(install.sh install-core.sh lib/*.sh modules/*.sh tests/*.sh)
          for f in assets/bin/*; do
            [[ "$f" == *write-onebot-config ]] || files+=("$f")
          done
          shellcheck -x -S warning "${files[@]}"

  astrbot-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install AstrBot end to end
        run: sudo ./install.sh install-astrbot
      - name: Verify service and WebUI
        run: |
          systemctl is-active nbot-astrbot.service
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:6185/; then exit 0; fi
            sleep 2
          done
          echo 'WebUI did not answer within 60s' >&2
          exit 1
      - name: nbot status and doctor
        run: |
          sudo nbot status
          sudo nbot doctor
      - name: Logs on failure
        if: failure()
        run: sudo journalctl -u nbot-astrbot.service -n 200 --no-pager || true

  bootstrap-e2e:
    # 真跑新用户的第一条命令：curl | sudo bash，不预先检出仓库。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Point data roots at /mnt before bootstrapping
        run: |
          sudo tee /etc/nbot.conf >/dev/null <<'EOF'
          NBOT_HOME=/mnt/nbot
          ASTRBOT_ROOT=/mnt/nbot/astrbot
          SNOWLUMA_ROOT=/mnt/nbot/snowluma
          SNOWLUMA_PAYLOAD_ROOT=/mnt/nbot/payload/snowluma
          EOF
          sudo chmod 600 /etc/nbot.conf
      - name: Install via the documented one-liner
        env:
          NBOT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # 走文档里的直连版本（runner 在海外，加速站反而慢）；
          # NBOT_ARGS 限定为 install-astrbot，避免在此任务里重复拆镜像。
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${NBOT_BRANCH}/bootstrap.sh" \
            | sudo NBOT_ARGS=install-astrbot NBOT_BRANCH="$NBOT_BRANCH" \
                   NBOT_REPO="${{ github.repository }}" bash
      - name: Verify bootstrap outcome
        run: |
          # 引导脚本应当落地安装器、注册 nbot 命令并真正装好 AstrBot。
          test -x /usr/local/sbin/nbot
          test -f /usr/local/lib/nbot/installer/install.sh
          systemctl is-active nbot-astrbot.service
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:6185/; then exit 0; fi
            sleep 2
          done
          echo 'WebUI did not answer within 60s' >&2
          exit 1
      - name: nbot help and status through the installed command
        run: |
          sudo nbot help
          sudo nbot status
          sudo nbot doctor
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u nbot-astrbot.service -n 200 --no-pager || true
          ls -la /usr/local/lib/nbot/installer 2>/dev/null || true

  full-stack:
    if: github.event_name == 'workflow_dispatch' && inputs.full_stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Point data roots at /mnt and disable China-facing mirrors
        run: |
          sudo tee /etc/nbot.conf >/dev/null <<'EOF'
          ASTRBOT_ROOT=/mnt/nbot/astrbot
          SNOWLUMA_ROOT=/mnt/nbot/snowluma
          SNOWLUMA_PAYLOAD_ROOT=/mnt/nbot/payload/snowluma
          SNOWLUMA_IMAGE_MIRROR=
          SNOWLUMA_IMAGE_FALLBACK_MIRROR=
          EOF
          sudo chmod 600 /etc/nbot.conf
          df -h /mnt
      - name: Install SnowLuma + QQ from the official image
        run: sudo ./install.sh install-snowluma
      - name: Verify QQ and SnowLuma services
        run: |
          systemctl is-active nbot-qq.service nbot-snowluma.service
          sudo /usr/local/lib/nbot/qq-status || true
      - name: Install noVNC (defaults, decline Caddy prompt)
        run: printf '\n\nn\n' | sudo ./install.sh install-novnc
      - name: Install Caddy (self-signed defaults)
        run: printf '\n\n\n\n' | sudo ./install.sh install-caddy
      - name: Verify reverse proxy chain (expect 401 without credentials)
        run: |
          code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/novnc/vnc.html)
          [ "$code" = 401 ]
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u nbot-qq.service -u nbot-snowluma.service \
            -u nbot-vnc.service -u nbot-novnc.service -u caddy.service \
            -n 300 --no-pager || true
          df -h || true
