name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_stack:
        description: 'Run the full SnowLuma image + noVNC + Caddy install test (heavy)'
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: |
          for f in install.sh install-core.sh lib/*.sh modules/*.sh tests/*.sh assets/bin/*; do
            [[ "$f" == *write-onebot-config ]] && continue
            bash -n "$f"
          done
          node --check assets/bin/write-onebot-config
      - name: Offline test suite
        run: |
          bash tests/static-check.sh
          bash tests/arch-check.sh
          bash tests/common-check.sh
          bash tests/onebot-check.sh
          bash tests/image-fallback-check.sh
          bash tests/github-fetch-check.sh
          bash tests/caddy-config-check.sh
          bash tests/mirror-menu-check.sh
          bash tests/noninteractive-check.sh
          bash tests/docs-check.sh
      - name: Release metadata check (GitHub API, may rate-limit)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/release-check.sh
      - name: ShellCheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          files=(install.sh install-core.sh lib/*.sh modules/*.sh tests/*.sh)
          for f in assets/bin/*; do
            [[ "$f" == *write-onebot-config ]] || files+=("$f")
          done
          shellcheck -x -S warning "${files[@]}"

  astrbot-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 匿名 GitHub API 每小时每 IP 只有 60 次，反复跑 CI 很容易触顶。
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Point data roots at /mnt
        run: |
          sudo tee /etc/nbot.conf >/dev/null <<'EOF'
          NBOT_HOME=/mnt/nbot
          ASTRBOT_ROOT=/mnt/nbot/astrbot
          SNOWLUMA_ROOT=/mnt/nbot/snowluma
          SNOWLUMA_PAYLOAD_ROOT=/mnt/nbot/payload/snowluma
          EOF
          sudo chmod 600 /etc/nbot.conf
      - name: Install AstrBot end to end
        run: sudo GITHUB_TOKEN="$GITHUB_TOKEN" ./install.sh install-astrbot
      - name: Verify service and WebUI
        run: |
          systemctl is-active nbot-astrbot.service
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:6185/; then exit 0; fi
            sleep 2
          done
          echo 'WebUI did not answer within 60s' >&2
          exit 1
      - name: nbot status, doctor and webui
        run: |
          sudo nbot status
          sudo nbot doctor
          # webui 必须报出账号，且不能再宣称固定的 astrbot/astrbot 密码。
          sudo nbot astrbot webui | tee /tmp/webui.txt
          grep -q 'AstrBot WebUI' /tmp/webui.txt
          ! grep -q 'astrbot / astrbot' /tmp/webui.txt
      - name: Version and rollback behaviour
        run: |
          sudo nbot astrbot version | tee /tmp/ver.txt
          grep -q '当前版本' /tmp/ver.txt
          # 首次安装还没有上一版，回滚必须明确拒绝而不是弄坏现有安装。
          if sudo nbot astrbot rollback 2>/tmp/rb.txt; then
            echo 'rollback should have refused with no previous version' >&2
            exit 1
          fi
          grep -q '没有可回滚的版本' /tmp/rb.txt
          systemctl is-active nbot-astrbot.service
          # 再装一次以产生上一版，然后验证回滚双向可用。
          sudo GITHUB_TOKEN="$GITHUB_TOKEN" ./install.sh install-astrbot
          test -d /mnt/nbot/astrbot/.app.previous
          before=$(sudo cat /mnt/nbot/astrbot/app/.nbot-version)
          sudo nbot astrbot rollback
          systemctl is-active nbot-astrbot.service
          after=$(sudo cat /mnt/nbot/astrbot/app/.nbot-version)
          echo "rollback: $before -> $after"
          # 回滚后仍要能提供服务，且能再切回来。
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:6185/ && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:6185/
          sudo nbot astrbot rollback
          again=$(sudo cat /mnt/nbot/astrbot/app/.nbot-version)
          [ "$again" = "$before" ]
          systemctl is-active nbot-astrbot.service
      - name: Restart policy matches the watchdog
        run: |
          # 1) 用户主动停止：systemd 与看门狗都不能把它拉起来。
          sudo nbot astrbot stop
          sudo systemctl start nbot-astrbot-watchdog.service
          sleep 3
          state=$(systemctl is-active nbot-astrbot.service || true)
          echo "after manual stop -> $state"
          [ "$state" = inactive ]
          sudo nbot astrbot start
          systemctl is-active nbot-astrbot.service

          # 2) 被信号杀死（等价于 OOM）：必须自动拉起来。
          old=$(systemctl show nbot-astrbot.service -p MainPID --value)
          sudo kill -9 "$old"
          for _ in $(seq 1 20); do
            new=$(systemctl show nbot-astrbot.service -p MainPID --value)
            [ -n "$new" ] && [ "$new" != 0 ] && [ "$new" != "$old" ] && break
            sleep 2
          done
          echo "after SIGKILL: $old -> $new"
          [ "$new" != "$old" ]
          systemctl is-active nbot-astrbot.service

          # 3) 起来就崩：试几次后必须停手，停在 failed，看门狗也不介入。
          sudo install -d /etc/systemd/system/nbot-astrbot.service.d
          # 用 ExecStartPre 制造启动失败：Type=simple 下 ExecStart=/bin/false
          # 只要 exec 成功就算启动成功，服务会显示 active 而不是 failed。
          { echo '[Service]'; echo 'ExecStartPre='
            echo 'ExecStartPre=/bin/false'; } |
            sudo tee /etc/systemd/system/nbot-astrbot.service.d/break.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl reset-failed nbot-astrbot.service
          sudo systemctl start nbot-astrbot.service || true
          for _ in $(seq 1 30); do
            state=$(systemctl is-active nbot-astrbot.service || true)
            [ "$state" = failed ] && break
            sleep 2
          done
          echo "always-failing unit -> $state"
          [ "$state" = failed ]
          # 必须是「试几次后主动放弃」，而不是无限重试到超时。
          sudo journalctl -u nbot-astrbot.service -n 50 --no-pager | tee /tmp/limit.txt
          grep -qi 'start request repeated too quickly\|start-limit-hit' /tmp/limit.txt
          # 看门狗在 failed 状态下必须原地不动，且要留下说明。
          sudo systemctl start nbot-astrbot-watchdog.service
          sleep 3
          [ "$(systemctl is-active nbot-astrbot.service || true)" = failed ]
          sudo journalctl -t nbot-astrbot-watchdog -n 20 --no-pager | tee /tmp/wd.txt
          grep -q 'systemd gave up' /tmp/wd.txt

          # 4) 修好之后要能正常启动：控制命令替用户清掉失败状态。
          sudo rm -f /etc/systemd/system/nbot-astrbot.service.d/break.conf
          sudo rmdir /etc/systemd/system/nbot-astrbot.service.d 2>/dev/null || true
          sudo systemctl daemon-reload
          sudo nbot astrbot start
          systemctl is-active nbot-astrbot.service
      - name: Reset the WebUI password with an explicit value
        run: |
          sudo NBOT_ASTRBOT_PASSWORD='CiTestPass123' nbot astrbot set-password
          # 服务必须活着、WebUI 必须还能响应，否则重置就是把用户锁在门外。
          systemctl is-active nbot-astrbot.service
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:6185/ && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:6185/
          # 一次性 drop-in 必须被清理，否则每次重启都会重置密码。
          test ! -e /etc/systemd/system/nbot-astrbot.service.d/reset-password.conf
          # 设定的密码必须真能登录，随机的旧密码必须失效。
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"astrbot","password":"CiTestPass123"}' \
            http://127.0.0.1:6185/api/auth/login)
          echo "login with new password -> $code"
          [ "$code" = 200 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"astrbot","password":"definitely-not-the-password"}' \
            http://127.0.0.1:6185/api/auth/login)
          echo "login with wrong password -> $code"
          [ "$code" != 200 ]
      - name: Reset again without a value, expect a generated password
        run: |
          sudo nbot astrbot set-password
          systemctl is-active nbot-astrbot.service
          test ! -e /etc/systemd/system/nbot-astrbot.service.d/reset-password.conf
          # 旧密码必须失效，说明确实重新生成了。
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"astrbot","password":"CiTestPass123"}' \
            http://127.0.0.1:6185/api/auth/login)
          echo "old password after regeneration -> $code"
          [ "$code" != 200 ]
          # 新的随机密码必须能被 webui 子命令读出来。
          sudo nbot astrbot webui | tee /tmp/webui2.txt
          grep -qE '初始密码 \S{8,}' /tmp/webui2.txt
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u nbot-astrbot.service -n 200 --no-pager || true
          ls -la /etc/systemd/system/nbot-astrbot.service.d 2>/dev/null || true

  bootstrap-e2e:
    # 真跑新用户的第一条命令：curl | sudo bash，不预先检出仓库。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Point data roots at /mnt before bootstrapping
        run: |
          sudo tee /etc/nbot.conf >/dev/null <<'EOF'
          NBOT_HOME=/mnt/nbot
          ASTRBOT_ROOT=/mnt/nbot/astrbot
          SNOWLUMA_ROOT=/mnt/nbot/snowluma
          SNOWLUMA_PAYLOAD_ROOT=/mnt/nbot/payload/snowluma
          EOF
          sudo chmod 600 /etc/nbot.conf
      - name: Install via the documented one-liner
        env:
          NBOT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # 走文档里的直连版本（runner 在海外，加速站反而慢）；
          # NBOT_ARGS 限定为 install-astrbot，避免在此任务里重复拆镜像。
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${NBOT_BRANCH}/bootstrap.sh" \
            | sudo NBOT_ARGS=install-astrbot NBOT_BRANCH="$NBOT_BRANCH" \
                   NBOT_REPO="${{ github.repository }}" bash
      - name: Verify bootstrap outcome
        run: |
          # 引导脚本应当落地安装器、注册 nbot 命令并真正装好 AstrBot。
          test -x /usr/local/sbin/nbot
          test -f /usr/local/lib/nbot/installer/install.sh
          systemctl is-active nbot-astrbot.service
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:6185/; then exit 0; fi
            sleep 2
          done
          echo 'WebUI did not answer within 60s' >&2
          exit 1
      - name: nbot help and status through the installed command
        run: |
          sudo nbot help
          sudo nbot status
          sudo nbot doctor
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u nbot-astrbot.service -n 200 --no-pager || true
          ls -la /usr/local/lib/nbot/installer 2>/dev/null || true

  full-stack:
    if: github.event_name == 'workflow_dispatch' && inputs.full_stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Point data roots at /mnt and disable China-facing mirrors
        run: |
          sudo tee /etc/nbot.conf >/dev/null <<'EOF'
          ASTRBOT_ROOT=/mnt/nbot/astrbot
          SNOWLUMA_ROOT=/mnt/nbot/snowluma
          SNOWLUMA_PAYLOAD_ROOT=/mnt/nbot/payload/snowluma
          SNOWLUMA_IMAGE_MIRROR=
          SNOWLUMA_IMAGE_FALLBACK_MIRROR=
          EOF
          sudo chmod 600 /etc/nbot.conf
          df -h /mnt
      - name: Install SnowLuma + QQ from the official image
        run: sudo GITHUB_TOKEN="$GITHUB_TOKEN" ./install.sh install-snowluma
      - name: Verify QQ and SnowLuma services
        run: |
          systemctl is-active nbot-qq.service nbot-snowluma.service
          sudo /usr/local/lib/nbot/qq-status || true
          # SnowLuma 用密码登录，没有 token；webui 子命令必须报出 admin 账号。
          sudo nbot snowluma webui | tee /tmp/sl-webui.txt
          grep -q 'SnowLuma WebUI' /tmp/sl-webui.txt
          grep -q 'admin' /tmp/sl-webui.txt
      - name: Reset the SnowLuma WebUI password
        run: |
          auth=/mnt/nbot/snowluma/data/config/webui.json
          before=$(sudo sha256sum "$auth" 2>/dev/null | awk '{print $1}' || echo none)
          sudo NBOT_SNOWLUMA_PASSWORD='CiTestPass123!' nbot snowluma set-password
          systemctl is-active nbot-snowluma.service
          # 一次性 drop-in 必须清理，否则每次重启都重置密码。
          test ! -e /etc/systemd/system/nbot-snowluma.service.d/bootstrap-password.conf
          # 凭据文件必须被重新生成（内容变了），且原文件已备份。
          after=$(sudo sha256sum "$auth" 2>/dev/null | awk '{print $1}' || echo none)
          echo "auth hash: $before -> $after"
          [ "$before" != "$after" ]
          # 配置目录是 0700 且属主为 snowluma，列目录必须用 sudo。
          sudo sh -c 'ls /mnt/nbot/snowluma/data/config/webui.json.bak.*' >/dev/null
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:5099/ && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:5099/
          # 设定的密码必须真能登录。
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"password":"CiTestPass123!"}' \
            http://127.0.0.1:5099/api/login)
          echo "snowluma login with new password -> $code"
          [ "$code" = 200 ]
      - name: Install noVNC (defaults, decline Caddy prompt)
        run: printf '\n\nn\n' | sudo ./install.sh install-novnc
      - name: Install Caddy (self-signed defaults)
        run: printf '\n\n\n\n' | sudo ./install.sh install-caddy
      - name: Verify reverse proxy chain (expect 401 without credentials)
        run: |
          code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/novnc/vnc.html)
          [ "$code" = 401 ]
      - name: Rotate the web login and verify it takes effect
        run: |
          sudo NBOT_CADDY_PASSWORD='RotatedPass123' nbot caddy set-auth
          systemctl is-active caddy.service
          url=https://127.0.0.1:8443/novnc/vnc.html
          code=$(curl -ks -o /dev/null -w '%{http_code}' -u 'admin:RotatedPass123' "$url")
          echo "login with rotated password -> $code"
          [ "$code" = 200 ]
          code=$(curl -ks -o /dev/null -w '%{http_code}' -u 'admin:definitely-wrong' "$url")
          echo "login with wrong password -> $code"
          [ "$code" = 401 ]
          # 轮换只改凭据，站点与 TLS 配置必须保持原样。
          grep -q '^:8443 {' /etc/caddy/conf.d/novnc.caddy
          grep -q '^    tls ' /etc/caddy/conf.d/novnc.caddy
          # x11vnc 在 Caddy 之后必须以 -nopw 运行，不再要求第二道密码。
          pgrep -af x11vnc | tee /tmp/x11vnc.txt || true
          grep -q -- '-nopw' /tmp/x11vnc.txt
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u nbot-qq.service -u nbot-snowluma.service \
            -u nbot-vnc.service -u nbot-novnc.service -u caddy.service \
            -n 300 --no-pager || true
          df -h || true
